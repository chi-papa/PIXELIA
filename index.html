<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIXELIA - サムネイル・バナー制作スタジオ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 起動時のキャンバスチラ見え防止用（home.js がここにスタート画面を描画します） -->
  <div id="pixelia-home-overlay" style="position:fixed; inset:0; z-index:9999; background:rgba(15,23,42,0.96); backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; padding:20px; overflow-y:auto;"></div>

  <!-- 上部ヘッダー -->
  <header class="topbar">
    <div class="topbar-left">
      <div id="app-logo" class="logo" title="トップページ（ホーム）へ戻る" style="cursor:pointer;">
        PIXELIA
      </div>
    </div>

    <div class="topbar-center">
      <button class="btn btn-sm" id="btn-undo" title="元に戻す (Ctrl+Z)"><i class="fa-solid fa-rotate-left"></i></button>
      <button class="btn btn-sm" id="btn-redo" title="やり直す (Ctrl+Y)"><i class="fa-solid fa-rotate-right"></i></button>
      <div class="divider"></div>
      <button class="btn btn-sm" id="btn-zoom-out" title="縮小"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
      <span id="zoom-level" class="zoom-label">100%</span>
      <button class="btn btn-sm" id="btn-zoom-in" title="拡大"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
      <button class="btn btn-sm" id="btn-zoom-fit" title="画面に合わせる"><i class="fa-solid fa-expand"></i></button>
    </div>

    <div class="topbar-right" id="topbar-actions">
      <!-- io.js 等がここに保存・書き出しボタンを追加 -->
    </div>
  </header>

  <!-- コンテキストバー（選択中オブジェクトのクイック操作） -->
  <div id="context-bar" class="context-bar"></div>

  <!-- メインワークスペース -->
  <div class="workspace">
    <!-- 左ツールバー -->
    <aside id="toolbar" class="toolbar">
      <button class="tool-btn active" id="mode-select" title="選択・移動 (V)">
        <i class="fa-solid fa-arrow-pointer"></i>
        <span>選択</span>
      </button>
      <button class="tool-btn" id="mode-pan" title="手のひらツール (Space)">
        <i class="fa-solid fa-hand"></i>
        <span>移動</span>
      </button>
      <div class="tool-divider"></div>
      <!-- 各プラグイン（テキスト・画像・図形・バッジ・パス等）のボタンがここに自動追加 -->
    </aside>

    <!-- 中央キャンバスエリア -->
    <main class="canvas-stage" id="canvas-stage">
      <canvas id="viewport"></canvas>
    </main>

    <!-- 右ドックパネル（プロパティ・レイヤー・拡張タブ） -->
    <aside class="dock" id="right-dock">
      <div class="dock-tabs" id="dock-tabs">
        <button class="dock-tab active" data-tab="props">プロパティ</button>
        <button class="dock-tab" data-tab="layers">レイヤー</button>
      </div>
      <div class="dock-body">
        <div class="dock-pane active" id="pane-props">
          <div id="properties-panel"></div>
        </div>
        <div class="dock-pane" id="pane-layers">
          <div id="layers-panel"></div>
        </div>
      </div>
    </aside>
  </div>

  <!-- コアエンジン -->
  <script src="js/core.js"></script>

  <!-- 基本プラグイン群 -->
  <script src="js/plugins/canvas.js"></script>
  <script src="js/plugins/image.js"></script>
  <script src="js/plugins/text.js"></script>
  <script src="js/plugins/shape.js"></script>
  <script src="js/plugins/badge.js"></script>
  <script src="js/plugins/path.js"></script>
  <script src="js/plugins/align.js"></script>
  <script src="js/plugins/palette.js"></script>
  <script src="js/plugins/adjust.js"></script>
  <script src="js/plugins/io.js"></script>

  <!-- スタート画面・自動保存プラグイン -->
  <script src="js/plugins/home.js?v=3"></script>
</body>
</html>
